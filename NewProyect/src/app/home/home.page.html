<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Blank
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <ng-container *ngIf="imageData; else loading">
      <ion-card>
        <img [src]="imageData.url" alt="NASA Image of the day" />
        <ion-card-header>
          <ion-card-title>{{imageData.title}}</ion-card-title>
        </ion-card-header>

        <ion-card-content>
          <p>{{imageData.explanation}}</p>
          <p><strong>Date:</strong>{{imageData.date}}</p>
        </ion-card-content>
      </ion-card>



      <ion-label position="floating">Enter a date</ion-label>
      <!--<ion-datetime-button datetime="datetime"></ion-datetime-button>-->
      <ion-button (click)="onClick()">Send</ion-button>
      <!--<ion-datetime displayFormat="YYYY-MM-DD" [(ngModel)]="date"></ion-datetime>
      <ion-input placeholder="Enter a date" [(ngModel)]="date"></ion-input>-->
    </ng-container>

    <ng-template #loading>
      <ion-spinner name="crescent"></ion-spinner>
    </ng-template>
  </ion-content>
</ion-content>
